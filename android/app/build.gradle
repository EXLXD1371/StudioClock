plugins {
    id 'com.android.application'
}

def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.studioclock.tablet'
    compileSdk 36
    buildToolsVersion providers.gradleProperty('studioClockBuildToolsVersion').getOrElse('35.0.0')
    defaultConfig {
        applicationId 'com.studioclock.tablet'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}

tasks.register('syncWebAssets', Sync) {
    from '../../dist-android'
    from('../../LICENSE') { rename { 'LICENSE.txt' } }
    from('../../ANDROID_THIRD_PARTY_NOTICES.txt') { rename { 'THIRD_PARTY_NOTICES.txt' } }
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
